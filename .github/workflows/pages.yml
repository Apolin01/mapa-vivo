# Publica el Mapa Vivo en GitHub Pages y lo refresca cada ~5 minutos leyendo el Google Sheet.
name: Publicar Mapa Vivo

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub puede retrasarlo unos minutos
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sincronizar noticias del Google Sheet
        run: python sync.py --sin-ia
      - name: Armar el sitio
        run: |
          mkdir -p _site
          cp index.html styles.css app.js _site/
          cp -r data _site/data
          rm -f _site/data/diag.log
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
